<aside class="rec-art many" aria-label="Recommended Article">
    <a href="{{ post.url | relative_url }}">
        <div class="rec-container">
            <div class="rec-info">
                <p class="post-title">
                    {%- if post.display-title -%}
                        {{ post.display-title | escape }}
                    {%- else -%}
                        {{ post.title | escape }}
                    {%- endif -%}
                </p>
                <p class="post-desc">
                    {%- if post.display-description -%}
                        {{ post.display-description | escape }}
                    {%- else -%}
                        {{ post.description | escape }}
                    {%- endif -%}
                </p>
            </div>
            <div class="rec-img">
                <figure>
                    <picture>
                        <source srcset="/.netlify/images?url={{ post.image }}&w=572&fm=avif" type="image/avif" />
                        <source srcset="/.netlify/images?url={{ post.image }}&w=572&fm=webp" type="image/webp" />
                        <img itemprop="image" src="{{ post.image }}" alt="{{ post.image-alt }}" loading="lazy"/>
                    </picture>
                </figure>
            </div>
        </div>
    </a>
</aside>
